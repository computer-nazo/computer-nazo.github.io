<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>個人用メモ</title>
<style>
  :root{
    --bg:#0b0c0f;
    --panel:#0f1114;
    --gutter:#0d1116;
    --text:#dbe9ff;
    --muted:#9aa3b2;
    --accent:#7c9cff;
    --radius:10px;
    --mono: "SFMono-Regular", Menlo, Monaco, "Roboto Mono", "Courier New", monospace;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    background:linear-gradient(180deg,var(--bg),#07080a);
    color:var(--text);
    font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px;
  }
  .card{
    width:900px;
    max-width:95%;
    background:linear-gradient(180deg,var(--panel),#0b0c0f);
    border-radius:var(--radius);
    box-shadow:0 10px 30px rgba(2,6,23,0.6);
    overflow:hidden;
    display:flex;
    border:1px solid rgba(255,255,255,0.03);
  }
  .gutter{
    width:72px;
    background:linear-gradient(180deg,var(--gutter),#0b0c0f);
    padding:18px 12px;
    color:var(--muted);
    font-family:var(--mono);
    font-size:13px;
    line-height:1.6;
    user-select:none;
  }
  .gutter .ln{
    display:block;
    text-align:right;
    padding-right:8px;
  }
  .code{
    flex:1;
    padding:18px;
    font-family:var(--mono);
    font-size:14px;
    line-height:1.6;
    color:var(--text);
    white-space:pre-wrap;
    word-break:break-word;
  }
  .header{
    display:flex;
    gap:10px;
    align-items:center;
    padding:12px 18px;
    border-bottom:1px solid rgba(255,255,255,0.02);
    background:linear-gradient(180deg, rgba(255,255,255,0.01), transparent);
  }
  .title{
    color:var(--accent);
    font-weight:700;
    font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
  }
  .meta{margin-left:auto; color:var(--muted); font-size:13px; font-family:var(--mono)}
  /* simple token colors (visual only) */
  .kw{color:#7c9cff}
  .str{color:#6ee7b7}
  .com{color:#7b8794}
  .num{color:#ffb86b}
  @media (max-width:700px){
    .gutter{display:none}
    .card{flex-direction:column}
  }
</style>
</head>
<body>
  <div style="width:900px; max-width:95%;">
    <div class="header">
      <div class="title">122573.xyz</div>
      <div class="meta">個人用 - sadako</div>
    </div>

    <div class="card" role="region" aria-label="メモ">
      <div class="gutter" aria-hidden="true">
        <span class="ln">1</span>
        <span class="ln">2</span>
        <span class="ln">3</span>
        <span class="ln">4</span>
        <span class="ln">5</span>
        <span class="ln">6</span>
        <span class="ln">7</span>
        <span class="ln">8</span>
        <span class="ln">9</span>
        <span class="ln">10</span>
        <span class="ln">11</span>
        <span class="ln">12</span>
        <span class="ln">13</span>
        <span class="ln">14</span>
        <span class="ln">15</span>
      </div>

      <div class="code">
<span class="kw">Title</span>: 個人用メモ - written by Sadako Real
<span class="kw">Date</span>: 2023-02-18 19:34

<span class="str">- 概要</span>
  ・あくまで個人用メモ。俺がいなくなったら見てくれ。伝わらないと思うけどな。

<span class="com">// これが見つかるのは、いつになるだろうか</span>

<span class="num">// メモ終わり</span>
      </div>
    </div>
  </div>
</body>
</html>
